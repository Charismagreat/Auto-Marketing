name: Build AutoMarketing Android APK

on:
  # 수동 트리거: GitHub 저장소 > Actions 탭에서 [Run workflow] 버튼을 클릭할 때 실행됩니다.
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes / 업데이트 설명'
        required: false
        default: '오토마케팅 모바일 안드로이드 공식 APK 릴리즈'

  # 필요 시 아래 push 설정을 주석 해제하면 main 브랜치 변경 시 자동 빌드됩니다.
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'android/**'
  #     - 'capacitor.config.json'
  #     - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p android/keystore
          if [ ! -f android/keystore/automarketing.jks ]; then
            echo "Generating permanent keystore..."
            keytool -genkeypair -v \
              -keystore android/keystore/automarketing.jks \
              -alias automarketing \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -storepass automarketing_key_2026 \
              -keypass automarketing_key_2026 \
              -dname "CN=AutoMarketing, OU=EGDesk, O=AutoMarketing Cloud, L=Seoul, ST=Seoul, C=KR"
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK Files
        run: |
          mkdir -p release-apk
          # release apk 복사 (없을 경우 debug apk fallback 탐색)
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/AutoMarketing.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apk/AutoMarketing.apk
          else
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apk/AutoMarketing.apk \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMarketing-APK
          path: release-apk/AutoMarketing.apk
          retention-days: 30

      - name: Commit Keystore and APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public/downloads
          cp release-apk/AutoMarketing.apk public/downloads/AutoMarketing.apk
          git add android/keystore/automarketing.jks public/downloads/AutoMarketing.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(android): update keystore and public AutoMarketing.apk [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Extract Version from Gradle
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n1 | cut -d'"' -f2)
          echo "VERSION_NAME=${VERSION_NAME:-1.0.0}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION_NAME }}
          name: "오토마케팅 안드로이드 앱 v${{ steps.get_version.outputs.VERSION_NAME }}"
          body: |
            ## 📱 오토마케팅(Auto-Marketing) 모바일 앱 릴리즈
            ${{ inputs.release_notes || '오토마케팅 모바일 안드로이드 공식 APK 릴리즈' }}

            ### 🚀 주요 기능
            - 1-Click All-in-One 소상공인 AI 마케팅 에셋 생성
            - 은행 실시간 무통장 입금 감지 및 Agent M 자동 매칭
            - 7대 채널 마케팅 캘린더 및 예약 자동 발행
            - 실시간 지갑 및 토큰 결제 시스템
          files: release-apk/AutoMarketing.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
